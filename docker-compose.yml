# ── Development Docker Compose ─────────────────────────────────────────────────
# Usage: docker-compose up --build
# All services hot-reload. No production optimisations.
#
# Host-port map (container ports are unchanged internally):
#   5100 → PostgreSQL   (container: 5432)
#   5101 → Redis        (container: 6379)
#   5102 → Backend API  (container: 8000)
#   5103 → Frontend     (container: 5173)
#   5104 → NGINX        (container: 80)

version: "3.9"

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-typeshala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-typeshala_password}
      POSTGRES_DB: ${POSTGRES_DB:-typeshala_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5100:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-typeshala} -d ${POSTGRES_DB:-typeshala_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "5101:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER:-typeshala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-typeshala_password}
      POSTGRES_DB: ${POSTGRES_DB:-typeshala_db}
      REDIS_HOST: redis
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      CORS_ORIGINS: '["http://localhost:5103","http://localhost:5104"]'
      LOG_LEVEL: DEBUG
    volumes:
      - ./backend:/app
    ports:
      - "5102:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Celery worker ─────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER:-typeshala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-typeshala_password}
      POSTGRES_DB: ${POSTGRES_DB:-typeshala_db}
      REDIS_HOST: redis
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── React frontend (Vite dev server) ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5104/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5103:5173"
    depends_on:
      - backend

  # ── NGINX gateway ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "5104:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
