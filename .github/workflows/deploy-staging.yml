name: Deploy → Staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false   # never interrupt an in-flight deploy

jobs:
  # ── 1. Run CI first ───────────────────────────────────────────────────────────
  ci:
    name: Run CI
    uses: ./.github/workflows/ci.yml

  # ── 2. Build & push images ────────────────────────────────────────────────────
  build:
    name: Build & push images
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write    # needed to push to GHCR

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        run: echo "version=stg-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:staging
            ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:staging
            ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to staging server ───────────────────────────────────────────────
  deploy:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    # Add `environment: staging` here once you create the env in GitHub → Settings → Environments

    steps:
      - uses: actions/checkout@v4

      - name: Write .env.staging to server and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STG_SSH_HOST }}
          username: ${{ secrets.STG_SSH_USER }}
          key: ${{ secrets.STG_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.STG_APP_DIR }}

            # Pull latest compose file
            git pull --ff-only

            # Write environment file
            cat > .env.staging <<'ENVEOF'
            POSTGRES_USER=${{ secrets.STG_POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.STG_POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.STG_POSTGRES_DB }}
            REDIS_PASSWORD=${{ secrets.STG_REDIS_PASSWORD }}
            SECRET_KEY=${{ secrets.STG_SECRET_KEY }}
            CORS_ORIGINS=${{ secrets.STG_CORS_ORIGINS }}
            IMAGE_TAG=${{ needs.build.outputs.image_tag }}
            ENVEOF

            # Log in to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull new images and restart
            docker compose -f docker-compose.stg.yml --env-file .env.staging pull
            docker compose -f docker-compose.stg.yml --env-file .env.staging up -d --remove-orphans

            # Run migrations
            docker compose -f docker-compose.stg.yml --env-file .env.staging \
              exec -T backend alembic upgrade head

            # Remove dangling images
            docker image prune -f
