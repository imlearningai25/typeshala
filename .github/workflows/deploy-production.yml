name: Deploy → Production

on:
  # Push a semver tag  (e.g.  git tag v1.2.3 && git push --tags)
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

  # Or trigger manually with an explicit confirmation
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-prod" to confirm'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Guard: require confirmation on manual runs ─────────────────────────────
  guard:
    name: Confirm deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy-prod" ]; then
            echo "❌ Confirmation string did not match. Aborting."
            exit 1
          fi

  # ── 1. Build & push production images ─────────────────────────────────────
  build:
    name: Build & push images
    needs: guard
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        run: |
          # Use git tag if available, else short SHA
          TAG=${GITHUB_REF_NAME:-$(echo $GITHUB_SHA | cut -c1-7)}
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy to production ───────────────────────────────────────────────
  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    # To add a mandatory reviewer gate: GitHub → Settings → Environments → New environment
    # → name it "production" and add Required reviewers before re-adding `environment: production`
    steps:
      - uses: actions/checkout@v4

      - name: Write .env.production to server and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROD_APP_DIR }}

            git pull --ff-only

            cat > .env.production <<'ENVEOF'
            POSTGRES_USER=${{ secrets.PROD_POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.PROD_POSTGRES_DB }}
            REDIS_PASSWORD=${{ secrets.PROD_REDIS_PASSWORD }}
            SECRET_KEY=${{ secrets.PROD_SECRET_KEY }}
            CORS_ORIGINS=${{ secrets.PROD_CORS_ORIGINS }}
            IMAGE_TAG=${{ needs.build.outputs.image_tag }}
            ENVEOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.prod.yml --env-file .env.production pull
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans

            # Migrate — run against the new backend container
            docker compose -f docker-compose.prod.yml --env-file .env.production \
              exec -T backend alembic upgrade head

            docker image prune -f
